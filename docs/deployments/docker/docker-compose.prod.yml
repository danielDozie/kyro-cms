version: '3.8'

services:
  kyro:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    environment:
      - NODE_ENV=production
      - KYRO_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-kyro}
      - KYRO_SECRET=${KYRO_SECRET}
      - KYRO_TENANT=${KYRO_TENANT:-default}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - kyro-network
    secrets:
      - kyro_secret

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-kyro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - kyro-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - kyro
    restart: always
    networks:
      - kyro-network

networks:
  kyro-network:
    driver: bridge

volumes:
  postgres_data:

secrets:
  kyro_secret:
    file: ./secrets/kyro_secret.txt
